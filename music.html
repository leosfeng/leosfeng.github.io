<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Music — Leo S. Feng</title>
    <meta
      name="description"
      content="This month on Apple Music."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400..600;1,400..600&family=Newsreader:ital,opsz,wght@1,6..72,400..500&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml" />
    <style>
      :root {
        --body-bg: #fdfdfc;
        --body-color: #111;
        --muted: rgba(0, 0, 0, 0.4);
        --rule: #f2f2f2;
        --font: "Figtree", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        --serif: "Newsreader", Georgia, serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        background: var(--body-bg);
        color: var(--body-color);
        min-height: 100%;
        max-width: 100%;
        overflow-x: clip;
      }

      body {
        position: relative;
        min-height: 100%;
        font-family: var(--font);
        font-size: 16px;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .page {
        position: relative;
        z-index: 1;
        max-width: 36.375rem;
        margin: 0 auto;
        padding: 1.25rem 1rem 2.5rem;
      }

      .page::before {
        content: "";
        pointer-events: none;
        z-index: 9;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 8rem;
        background: linear-gradient(
          180deg,
          #fff 0,
          hsla(0, 0%, 100%, 0.738) 19%,
          hsla(0, 0%, 100%, 0.541) 34%,
          hsla(0, 0%, 100%, 0.382) 47%,
          hsla(0, 0%, 100%, 0.278) 56.5%,
          hsla(0, 0%, 100%, 0.194) 65%,
          hsla(0, 0%, 100%, 0.126) 73%,
          hsla(0, 0%, 100%, 0.075) 80.2%,
          hsla(0, 0%, 100%, 0.042) 86.1%,
          hsla(0, 0%, 100%, 0.021) 91%,
          hsla(0, 0%, 100%, 0.008) 95.2%,
          hsla(0, 0%, 100%, 0.002) 98.2%,
          hsla(0, 0%, 100%, 0)
        );
      }

      .water-surface {
        position: relative;
        width: 100%;
        height: 4.25rem;
        z-index: 10;
        pointer-events: none;
        overflow: hidden;
      }

      .wave-track {
        position: absolute;
        top: 0.7rem;
        left: 0;
        display: flex;
        width: 200%;
        height: 2.6rem;
        animation: waveDrift 18s linear infinite;
      }

      .wave-track-b {
        top: 1.15rem;
        opacity: 0.42;
        animation-duration: 26s;
        animation-direction: reverse;
      }

      .wave-svg {
        display: block;
        flex: 0 0 50%;
        width: 50%;
        height: 100%;
        overflow: visible;
      }

      .wave-line {
        fill: none;
        stroke: hsl(198, 28%, 50%);
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .boat {
        position: absolute;
        top: 0.35rem;
        left: 0;
        width: 3.35rem;
        color: rgba(0, 0, 0, 0.5);
        animation: boatSail 34s linear infinite;
        will-change: transform;
      }

      .boat-inner {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
        transform-origin: 50% 85%;
        animation: boatBob 3.4s ease-in-out infinite;
      }

      @keyframes waveDrift {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-50%);
        }
      }

      @keyframes boatSail {
        0% {
          transform: translateX(8vw) scaleX(1);
        }
        49.9% {
          transform: translateX(78vw) scaleX(1);
        }
        50% {
          transform: translateX(78vw) scaleX(-1);
        }
        100% {
          transform: translateX(8vw) scaleX(-1);
        }
      }

      @keyframes boatBob {
        0%,
        100% {
          transform: translateY(0) rotate(-3deg);
        }
        50% {
          transform: translateY(2.5px) rotate(3deg);
        }
      }

      .reef-life {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .drift-fish {
        position: absolute;
        opacity: 0.32;
        color: rgba(0, 0, 0, 0.55);
      }

      .fish-a {
        top: 18%;
        width: 1.7rem;
        animation: fishSwim 34s linear infinite;
      }

      .fish-b {
        top: 42%;
        width: 2.1rem;
        animation: fishSwimRev 42s linear infinite;
        animation-delay: -14s;
      }

      .fish-c {
        top: 63%;
        width: 1.55rem;
        animation: fishSwim 38s linear infinite;
        animation-delay: -22s;
      }

      @keyframes fishSwim {
        from {
          transform: translateX(-8vw);
        }
        to {
          transform: translateX(108vw);
        }
      }

      @keyframes fishSwimRev {
        from {
          transform: translateX(108vw) scaleX(-1);
        }
        to {
          transform: translateX(-8vw) scaleX(-1);
        }
      }

      .bubble {
        position: absolute;
        border: 1.2px solid hsl(198, 28%, 58%);
        border-radius: 50%;
        opacity: 0.35;
        animation: bubbleRise 11s ease-in infinite;
      }

      .bubble:nth-child(1) {
        left: 12%;
        width: 6px;
        height: 6px;
        bottom: 8%;
        animation-duration: 13s;
      }

      .bubble:nth-child(2) {
        left: 38%;
        width: 4px;
        height: 4px;
        bottom: 4%;
        animation-duration: 9s;
        animation-delay: -3s;
      }

      .bubble:nth-child(3) {
        left: 71%;
        width: 7px;
        height: 7px;
        bottom: 12%;
        animation-duration: 15s;
        animation-delay: -6s;
      }

      .bubble:nth-child(4) {
        left: 88%;
        width: 5px;
        height: 5px;
        bottom: 2%;
        animation-duration: 11s;
        animation-delay: -1s;
      }

      @keyframes bubbleRise {
        0% {
          transform: translateY(0);
          opacity: 0;
        }
        12% {
          opacity: 0.35;
        }
        100% {
          transform: translateY(-70vh);
          opacity: 0;
        }
      }

      .article > header {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        padding: 0 0 0.5rem;
      }

      .article > header h1,
      .article > header p {
        font-size: 0.875rem;
        line-height: 1.25rem;
        letter-spacing: -0.00563rem;
      }

      .article > header h1 {
        color: #111;
        font-weight: 500;
        white-space: nowrap;
      }

      .article > header h1 a {
        transition: opacity 0.14s ease;
      }

      .article > header h1 a:hover {
        opacity: 0.45;
      }

      .article > header p {
        color: var(--muted);
        font-weight: 460;
      }

      .header-top {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
      }

      .fish-counter {
        margin: 0;
        color: var(--muted);
        font-size: 0.875rem;
        font-weight: 460;
        letter-spacing: -0.00563rem;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .fish-counter.is-in {
        animation: fishIn 0.35s ease both;
      }

      @keyframes fishIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .music-intro {
        padding-top: 1.65rem;
        max-width: 32rem;
        color: var(--body-color);
        font-size: 0.875rem;
        font-weight: 460;
        line-height: 1.45rem;
        letter-spacing: -0.00563rem;
      }

      .chart {
        padding: 2.25rem 0 0;
      }

      .chart + .chart {
        padding-top: 2.6rem;
      }

      .chart-title {
        color: var(--muted);
        font-size: 0.875rem;
        font-weight: 460;
        letter-spacing: -0.00563rem;
        line-height: 1.25rem;
        padding-bottom: 0.45rem;
      }

      .chart ul {
        display: flex;
        flex-direction: column;
        list-style: none;
      }

      .chart .course {
        position: relative;
        display: flex;
        align-items: baseline;
        justify-content: flex-start;
        gap: 0.85rem;
        padding: 0.735rem 0 0.735rem 2.05rem;
      }

      .chart .course.has-cover {
        align-items: center;
        padding-top: 0.55rem;
        padding-bottom: 0.55rem;
      }

      .chart .course::after {
        content: "";
        border-bottom: 1px solid var(--rule);
        position: absolute;
        bottom: 0;
        left: 2.05rem;
        right: 0;
      }

      .chart li:last-child .course::after {
        display: none;
      }

      .rank {
        position: absolute;
        left: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 1.55rem;
        color: var(--muted);
        font-size: 0.8125rem;
        font-weight: 460;
        letter-spacing: -0.00563rem;
        font-variant-numeric: tabular-nums;
      }

      .song-cover {
        flex-shrink: 0;
        width: 2.5rem;
        height: 2.5rem;
        object-fit: cover;
        border-radius: 2px;
        background: #ecece8;
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.06);
        transition: transform 0.2s ease;
      }

      .artist-cover {
        border-radius: 50%;
        object-position: center 18%;
      }

      .chart a.course:hover .song-cover {
        transform: translateY(-1px) rotate(-4deg);
      }

      .chart a.course:hover .artist-cover {
        transform: translateY(-1px) rotate(-3deg);
      }

      .chart .course h2 {
        min-width: 0;
        color: #111;
        font-size: 0.875rem;
        font-weight: 460;
        letter-spacing: -0.00563rem;
        line-height: 1.25rem;
        transition: opacity 0.14s ease;
      }

      .chart .has-cover h2 {
        flex: 1;
        font-family: var(--serif);
        font-size: 1.02rem;
        font-style: italic;
        font-weight: 430;
        letter-spacing: 0.01rem;
        line-height: 1.2;
      }

      .chart a.course:hover h2 {
        opacity: 0.45;
      }

      .chart .code {
        flex-shrink: 0;
        max-width: 38%;
        margin-left: auto;
        color: var(--muted);
        font-size: 0.8125rem;
        font-weight: 460;
        letter-spacing: -0.00563rem;
        text-align: right;
      }

      .music-embed {
        padding-top: 2.5rem;
      }

      .music-embed iframe {
        display: block;
        width: 100%;
        height: 28rem;
        border: 0;
        overflow: hidden;
        background: transparent;
      }

      .site-footer {
        padding: 2.5rem 0 2rem;
      }

      .site-footer .inner::before {
        content: "";
        display: block;
        height: 1px;
        width: 3.125rem;
        background: #ededed;
        margin: 0 0 2.375rem;
      }

      .ocean-floor {
        position: relative;
        margin-top: 1.75rem;
        color: rgba(0, 0, 0, 0.4);
      }

      .seabed {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
        pointer-events: none;
      }

      .kelp {
        fill: none;
        stroke: hsl(142, 40%, 44%);
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        transform-box: fill-box;
        transform-origin: 50% 100%;
      }

      .kelp-a {
        animation: kelpSway 6.5s ease-in-out infinite;
      }

      .kelp-b {
        stroke: hsl(128, 36%, 46%);
        animation: kelpSway 7.8s ease-in-out infinite reverse;
      }

      .kelp-c {
        animation: kelpSway 5.6s ease-in-out infinite 0.6s;
      }

      .coral {
        fill: none;
        stroke-width: 1.45;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .coral-yellow {
        stroke: hsl(44, 64%, 48%);
      }

      .coral-pink {
        stroke: hsl(348, 58%, 52%);
      }

      .coral-orange {
        stroke: hsl(22, 62%, 50%);
      }

      .treasure {
        fill: none;
        stroke: hsl(38, 48%, 42%);
        stroke-width: 1.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .record-player {
        fill: none;
        stroke: rgba(0, 0, 0, 0.45);
        stroke-width: 1.35;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .record-player .horn {
        stroke: hsl(38, 48%, 42%);
      }

      .seafloor-fine {
        stroke-width: 1.1;
      }

      .sand-fill {
        fill: var(--body-bg);
      }

      .sand-line {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
      }

      @keyframes kelpSway {
        0%,
        100% {
          transform: rotate(-2.4deg);
        }
        50% {
          transform: rotate(2.4deg);
        }
      }

      .music-note-mark {
        fill: none;
        stroke: hsl(38, 48%, 42%);
        stroke-width: 1.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .note {
        animation: noteFloat 5.2s ease-in infinite;
      }

      .note-b {
        animation-delay: -1.7s;
      }

      .note-c {
        animation-delay: -3.4s;
      }

      @keyframes noteFloat {
        0% {
          transform: translate(0, 0);
          opacity: 0;
        }
        18% {
          opacity: 0.75;
        }
        100% {
          transform: translate(-10px, -16px);
          opacity: 0;
        }
      }

      .vinyl-spin {
        transform-box: fill-box;
        transform-origin: center;
        animation: vinylSpin 2.4s linear infinite;
      }

      @keyframes vinylSpin {
        0% {
          transform: scaleY(0.42) rotate(0deg);
        }
        25% {
          transform: scaleY(0.36) rotate(90deg);
        }
        50% {
          transform: scaleY(0.45) rotate(180deg);
        }
        75% {
          transform: scaleY(0.38) rotate(270deg);
        }
        100% {
          transform: scaleY(0.42) rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .kelp-a,
        .kelp-b,
        .kelp-c,
        .wave-track,
        .boat,
        .boat-inner,
        .drift-fish,
        .bubble,
        .vinyl-spin,
        .note {
          animation: none;
        }
      }

      @media screen and (max-width: 768px) {
        .page {
          padding: 1.25rem 1.5rem 2.5rem;
        }

        .page::before {
          height: 2.5rem;
        }
      }

      @media screen and (max-width: 520px) {
        .chart .code {
          max-width: 34%;
        }
      }
    </style>
  </head>
